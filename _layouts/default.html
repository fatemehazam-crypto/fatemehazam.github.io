<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip }}">
  <meta name="author" content="Fatemeh Azam">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f7f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151b1e" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Fatemeh Azam",
    "jobTitle": "Senior Software Engineer",
    "worksFor": { "@type": "Organization", "name": "Oklahoma Cyber Innovation Institute, University of Tulsa" },
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "sameAs": [
      "https://github.com/{{ site.github_username }}"{% if site.linkedin_url != "" %},
      "{{ site.linkedin_url }}"{% endif %}
    ]
  }
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-row">
      <a class="wordmark" href="{{ '/' | relative_url }}">Fatemeh Azam</a>
      <nav aria-label="Sections">
        <ul>
          <li><a href="#work">Work</a></li>
          <li><a href="#talks-and-papers">Talks and papers</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ site.time | date: "%Y" }} Fatemeh Azam. Tulsa, Oklahoma.</p>
    </div>
  </footer>
</body>
</html>
